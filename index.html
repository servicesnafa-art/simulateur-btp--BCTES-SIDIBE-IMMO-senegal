<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur BTP Sénégal Pro</title>
    <style>
        :root {
            --primary-color: #1b5e20;
            --secondary-color: #2e7d32;
            --accent-color: #ff8f00;
            --bg-color: #f4f6f8;
            --text-color: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: var(--secondary-color);
        }
        .results {
            margin-top: 30px;
            background: #e8f5e9;
            padding: 20px;
            border-radius: 8px;
            border-left: 5px solid var(--primary-color);
        }
        .results h2 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 20px;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
            border-bottom: 1px dashed #c8e6c9;
            padding-bottom: 6px;
        }
        .total {
            font-weight: bold;
            font-size: 18px;
            color: #d32f2f;
            border-bottom: none;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Simulateur BTP Sénégal Pro</h1>
    
    <div class="form-group">
        <label for="surface">Surface totale de construction (m²) :</label>
        <input type="number" id="surface" placeholder="Ex: 150" value="100">
    </div>

    <div class="form-group">
        <label for="standing">Niveau de Standing :</label>
        <select id="standing">
            <option value="120000">Économique (120 000 FCFA / m²)</option>
            <option value="180000" selected>Standard (180 000 FCFA / m²)</option>
            <option value="250000">Haut Standing (250 000 FCFA / m²)</option>
        </select>
    </div>

    <button onclick="calculerDevis()">Calculer l'estimation</button>

    <div class="results" id="resultatsSection" style="display:none;">
        <h2>Estimation Prévisionnelle</h2>
        <div class="result-item">
            <span>Gros Œuvre (Fondation, murs, dalle) :</span>
            <span id="grosOeuvre">0 FCFA</span>
        </div>
        <div class="result-item">
            <span>Second Œuvre & Toiture :</span>
            <span id="secondOeuvre">0 FCFA</span>
        </div>
        <div class="result-item">
            <span>Finitions (Carrelage, peinture, plomberie) :</span>
            <span id="finitions">0 FCFA</span>
        </div>
        <div class="result-item total">
            <span>Coût Total Estimé :</span>
            <span id="totalCost">0 FCFA</span>
        </div>
    </div>
</div>

<script>
function calculerDevis() {
    const surface = parseFloat(document.getElementById('surface').value);
    const prixM2 = parseFloat(document.getElementById('standing').value);

    if (isNaN(surface) || surface <= 0) {
        alert("Veuillez entrer une surface valide.");
        return;
    }

    const coutTotal = surface * prixM2;
    
    // Répartition estimée standard dans le BTP
    const partGrosOeuvre = coutTotal * 0.50;
    const partSecondOeuvre = coutTotal * 0.25;
    const partFinitions = coutTotal * 0.25;

    // Affichage des résultats avec formatage monétaire
    document.getElementById('grosOeuvre').innerText = formatFCFA(partGrosOeuvre);
    document.getElementById('secondOeuvre').innerText = formatFCFA(partSecondOeuvre);
    document.getElementById('finitions').innerText = formatFCFA(partFinitions);
    document.getElementById('totalCost').innerText = formatFCFA(coutTotal);

    document.getElementById('resultatsSection').style.display = 'block';
}

function formatFCFA(montant) {
    return Math.round(montant).toLocaleString('fr-FR') + " FCFA";
}
</script>

</body>
</html>
