<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulateur BTP Sénégal Pro</title>
    <!-- Tailwind CSS pour un design propre et responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js pour les graphiques -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- En-tête -->
    <header class="bg-emerald-700 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold">Simulateur BTP Sénégal Pro</h1>
        <!-- Bouton Éditeur / Crayon visible -->
        <button id="editorToggleBtn" onclick="toggleEditor()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-sm flex items-center gap-2 shadow transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
            Éditeur / Barèmes
        </button>
    </header>

    <main class="flex-grow container mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Section Paramètres / Barèmes (Visible par défaut, sans classe hidden) -->
        <section id="parametersSection" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 lg:col-span-1">
            <h2 class="text-lg font-semibold text-emerald-700 mb-4 border-b pb-2">Paramètres & Barèmes (FCFA / m²)</h2>
            <div class="space-y-4 text-sm">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Coût Gros Œuvre (m²)</label>
                    <input type="number" id="paramGrosOeuvre" value="75000" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none" oninput="calculateQuote()">
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Coût Second Œuvre (m²)</label>
                    <input type="number" id="paramSecondOeuvre" value="50000" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none" oninput="calculateQuote()">
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Coût Finitions & Options (m²)</label>
                    <input type="number" id="paramOptions" value="35000" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none" oninput="calculateQuote()">
                </div>
            </div>
        </section>

        <!-- Section Saisie Projet -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 lg:col-span-2 space-y-4">
            <h2 class="text-lg font-semibold text-emerald-700 mb-2 border-b pb-2">Caractéristiques du Projet</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Surface du bâtiment (m²)</label>
                    <input type="number" id="surfaceInput" value="150" placeholder="Ex: 150" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none" oninput="calculateQuote()">
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">Type de Standing</label>
                    <select id="standingSelect" class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none" onchange="calculateQuote()">
                        <option value="1">Économique (Standard)</option>
                        <option value="1.25" selected>Standing Moyen</option>
                        <option value="1.6">Haut Standing / Luxe</option>
                    </select>
                </div>
            </div>

            <!-- Résultats du calcul -->
            <div class="mt-6 bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                <h3 class="font-bold text-slate-700">Estimation Financière</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
                    <div class="bg-white p-3 rounded-lg shadow-xs border">
                        <span class="text-xs text-slate-500 block">Gros Œuvre</span>
                        <span id="grosOeuvreCost" class="font-bold text-emerald-600 text-sm">0 FCFA</span>
                    </div>
                    <div class="bg-white p-3 rounded-lg shadow-xs border">
                        <span class="text-xs text-slate-500 block">Second Œuvre</span>
                        <span id="secondOeuvreCost" class="font-bold text-emerald-600 text-sm">0 FCFA</span>
                    </div>
                    <div class="bg-white p-3 rounded-lg shadow-xs border">
                        <span class="text-xs text-slate-500 block">Options / Finitions</span>
                        <span id="optionsCost" class="font-bold text-emerald-600 text-sm">0 FCFA</span>
                    </div>
                    <div class="bg-emerald-700 text-white p-3 rounded-lg shadow-xs">
                        <span class="text-xs text-emerald-100 block">Coût Total Estimé</span>
                        <span id="totalCost" class="font-bold text-base">0 FCFA</span>
                    </div>
                </div>
            </div>

            <!-- Graphique -->
            <div class="mt-4 pt-4 border-t">
                <canvas id="costChart" class="max-h-50"></canvas>
            </div>
        </section>

    </main>

    <!-- Script de calcul et de gestion de l'interface -->
    <script>
        let costChart = null;

        function formatFCFA(amount) {
            return new Intl.NumberFormat('fr-FR').format(Math.round(amount)) + " FCFA";
        }

        function toggleEditor() {
            const paramsSection = document.getElementById('parametersSection');
            // Bascule l'affichage des paramètres si l'utilisateur clique sur l'éditeur
            if (paramsSection.style.display === 'none') {
                paramsSection.style.display = 'block';
            } else {
                paramsSection.style.display = 'none';
            }
        }

        function calculateQuote() {
            // Récupération des valeurs de surface et de standing
            const surface = parseFloat(document.getElementById('surfaceInput').value) || 0;
            const standingMultiplier = parseFloat(document.getElementById('standingSelect').value) || 1;

            // Récupération des barèmes personnalisables
            const baseGros = parseFloat(document.getElementById('paramGrosOeuvre').value) || 0;
            const baseSecond = parseFloat(document.getElementById('paramSecondOeuvre').value) || 0;
            const baseOptions = parseFloat(document.getElementById('paramOptions').value) || 0;

            // Calculs par poste avec application du coefficient de standing
            const grosOeuvre = surface * baseGros * standingMultiplier;
            const secondOeuvre = surface * baseSecond * standingMultiplier;
            const options = surface * baseOptions * standingMultiplier;
            const total = grosOeuvre + secondOeuvre + options;

            // Mise à jour de l'affichage textuel
            document.getElementById('grosOeuvreCost').innerText = formatFCFA(grosOeuvre);
            document.getElementById('secondOeuvreCost').innerText = formatFCFA(secondOeuvre);
            document.getElementById('optionsCost').innerText = formatFCFA(options);
            document.getElementById('totalCost').innerText = formatFCFA(total);

            // Mise à jour du graphique
            updateChart(grosOeuvre, secondOeuvre, options);
        }

        function updateChart(gros, second, options) {
            const ctx = document.getElementById('costChart').getContext('2d');
            
            if (costChart) {
                costChart.data.datasets[0].data = [gros, second, options];
                costChart.update();
            } else {
                costChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Gros Œuvre', 'Second Œuvre', 'Options & Finitions'],
                        datasets: [{
                            data: [gros, second, options],
                            backgroundColor: ['#059669', '#10b981', '#34d399'],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: { font: { size: 11 } }
                            }
                        }
                    }
                });
            }
        }

        // Lancer le calcul initial au chargement de la page
        window.onload = function() {
            calculateQuote();
        };
    </script>
</body>
</html>
